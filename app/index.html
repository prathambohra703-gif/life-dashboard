<style>
/* Layout: left rail on desktop, bottom bar on phone; cards on a quiet navy ground, icy blue as the single accent. */
:root{
  --bg:#070b12; --bg2:#0a111c; --surface:#0e1624; --surface2:#142033; --line:#1d2b42; --line2:#2a3b57;
  --fg:#e8f1fb; --mute:#8aa0bd; --faint:#5d718d;
  --accent:#9bd8ff; --accent2:#5db4ee; --accent-ink:#06121f; --glow:rgba(155,216,255,.16);
  --good:#74e0c2; --warn:#f3c978; --bad:#ff8f95;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.35);
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Figtree',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#edf3fa; --bg2:#e4edf7; --surface:#ffffff; --surface2:#f1f6fc; --line:#d5e1ef; --line2:#bccdE2;
  --fg:#0e1a2b; --mute:#51667f; --faint:#7d90a8; --accent:#1479b9; --accent2:#0e5f93; --accent-ink:#ffffff; --glow:rgba(20,121,185,.12);
  --good:#0f8f72; --warn:#a8710c; --bad:#c23b45; --shadow:0 1px 2px rgba(20,50,90,.08),0 8px 24px rgba(20,50,90,.08); color-scheme:light}
:root[data-theme="dark"]{
  --bg:#070b12; --bg2:#0a111c; --surface:#0e1624; --surface2:#142033; --line:#1d2b42; --line2:#2a3b57;
  --fg:#e8f1fb; --mute:#8aa0bd; --faint:#5d718d; --accent:#9bd8ff; --accent2:#5db4ee; --accent-ink:#06121f; --glow:rgba(155,216,255,.16);
  --good:#74e0c2; --warn:#f3c978; --bad:#ff8f95; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);margin:0;padding-inline:16px;padding-block:0 96px;
  background-image:radial-gradient(900px 420px at 80% -10%,var(--glow),transparent 70%),radial-gradient(700px 400px at -10% 10%,rgba(93,180,238,.07),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:1120px;margin-inline:auto;display:block}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:20px 8px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font:600 11px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.top h1{font-size:26px}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;color:var(--mute);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.acc{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{border:1px solid var(--line2);background:var(--surface2);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{border-color:var(--accent);background:var(--surface)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;padding:0;border-radius:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:7px 2px;border-radius:12px;color:var(--faint);font-size:11px;font-weight:600}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--glow)}
@media (min-width:860px){
  body{padding-left:calc(16px + 96px);padding-block:0 40px}
  nav.tabs{top:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 8px;border-top:0;border-right:1px solid var(--line)}
  nav.tabs button{padding:11px 2px}
}

.grid{display:grid;align-items:start;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-top:14px}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg)));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.hero{border-color:var(--line2);background:radial-gradient(500px 220px at 100% 0,var(--glow),transparent 70%),var(--surface)}
.card h2{font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2 small{font:500 12px var(--font-body);color:var(--mute)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.muted{color:var(--mute)} .faint{color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row.sp{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--line);margin-block:12px}
.quote{font:600 19px/1.35 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.big{font:600 34px/1 var(--font-display);letter-spacing:-.02em}
.mid{font:600 22px/1 var(--font-display)}

input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
input[type=time]{width:auto}
textarea{resize:vertical;min-height:84px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

.habit{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);width:100%;text-align:left;min-width:0}
.habit .ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent}
.habit.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.habit.done .ck{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.habit .t{flex:1;min-width:0}
.habit .t b{display:block;font-weight:600;font-size:14px}
.habit .t span{font-size:12px;color:var(--mute)}
.habit-box{padding:0;border:0;background:none;display:block}
.habit-wrap{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.habit-wrap.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.habit-wrap .ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent}
.habit-wrap.done .ck{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.habit-wrap .t{flex:1;min-width:0}
.habit-wrap .t b{display:block;font-weight:600;font-size:14px}
.habit-wrap .t span{font-size:12px;color:var(--mute)}
.habit-wrap input[type=time]{padding:5px 8px}

.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line);fill:none}
.ring .pg{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:600 20px var(--font-display)} .ring .c span{font-size:11px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.good>i{background:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface2);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mute)}
.chip[aria-pressed="true"],.chip.on{background:var(--glow);color:var(--accent);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.li .m span{font-size:12px;color:var(--mute)}
.x{border:0;background:transparent;color:var(--faint);padding:4px 8px;border-radius:8px;font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.days{display:inline-flex;align-items:center;justify-content:center;min-width:58px;padding:4px 8px;border-radius:8px;font:600 12px var(--font-mono);background:var(--surface2);border:1px solid var(--line)}
.days.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.days.now{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.days.done{color:var(--good)}
.stat{display:flex;flex-direction:column;gap:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:11px;color:var(--mute)}
.week button b{font:600 13px var(--font-display);color:var(--fg)}
.week button.today{border-color:var(--accent)}
.week button.sel{background:var(--glow);border-color:var(--accent)}
.week button.rest b{color:var(--faint)}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.setchip{display:inline-flex;gap:6px;align-items:center;padding:4px 6px 4px 10px;border-radius:99px;background:var(--glow);color:var(--accent);font:500 12px var(--font-mono)}
.setchip button{border:0;background:transparent;color:inherit;padding:0 4px;opacity:.6}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .b{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bars .b .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mute);font:11px var(--font-mono)}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:14px;color:var(--mute);text-align:center;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--surface2);border:1px solid var(--line2);padding:9px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
@media (min-width:860px){.toast{bottom:28px}}

/* chat dock */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;height:48px;padding:0 18px;border-radius:99px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 8px 30px var(--glow)}
.fab[hidden]{display:none}
.qa{display:block;margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--accent)}.qa::before{content:'— '}
.heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;min-width:8px}
.dots{display:grid;grid-template-columns:28px repeat(7,1fr);gap:6px;align-items:center}
.dots b{font:600 10px var(--font-mono,monospace);color:var(--faint)}
.dots i{display:block;aspect-ratio:1;border-radius:99px;max-width:22px;justify-self:center;width:100%}
.plink{cursor:pointer}.plink:hover b{color:var(--accent)}
.hist{margin:-4px 0 12px 8px;padding-left:12px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.hl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;font-size:13px}
.hl .hm span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.hl .hr{text-align:right}.hl .hr small{display:block;font-size:11px;color:var(--mute)}
[hidden]{display:none!important}
.sheet .card{max-height:calc(100vh - 32px);overflow:auto}
.chip:has(input:checked){background:var(--glow);color:var(--accent);border-color:var(--accent)}
.chip input{width:auto;margin-right:6px;accent-color:var(--accent)}
.sprow{display:grid;grid-template-columns:1fr 104px 30px;gap:8px;align-items:center}
.sprow.you{grid-template-columns:1fr auto;padding:8px 10px;border:1px dashed var(--line2);border-radius:10px;font-size:13px}
.spsum{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--glow);min-height:18px}
.spsum.err{background:transparent;color:var(--warn);border:1px dashed var(--line2)}
details.splitbox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}details.splitbox summary{cursor:pointer;font-weight:600;font-size:13px}details.splitbox .fld{margin-top:10px}
@media (min-width:860px){.fab{bottom:24px;right:24px}}
.dock{position:fixed;right:0;bottom:0;top:auto;width:min(440px,100%);max-height:86%;height:560px;z-index:50;background:var(--surface);border:1px solid var(--line2);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:860px){.dock{right:24px;bottom:24px;border-radius:20px}}
.dock header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dock .msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:14px;max-width:92%;font-size:14px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--glow);color:var(--fg)}
.msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.pend{border:1px solid var(--line2);border-radius:14px;padding:12px;background:var(--bg2);display:flex;flex-direction:column;gap:8px}
.dock form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(3,7,12,.6);display:grid;place-items:center;padding:16px}
.sheet .card{max-width:480px;width:100%}
/* ---- polish pass: glass cards, aurora ground, sliders, hero ---- */
body{background-image:radial-gradient(900px 520px at 88% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%),radial-gradient(760px 560px at -10% 8%,color-mix(in srgb,#8aa0ff 16%,transparent),transparent 65%),radial-gradient(700px 520px at 55% 112%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 62%)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--accent) 6%,transparent) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.top h1{font-size:30px;letter-spacing:-.02em}
.top h1::after{content:'';display:block;width:34px;height:3px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,var(--accent),transparent)}
.card{position:relative;border-radius:22px;border:1px solid color-mix(in srgb,var(--accent) 12%,var(--line));background:linear-gradient(165deg,color-mix(in srgb,var(--surface2) 72%,transparent),color-mix(in srgb,var(--surface) 84%,transparent));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 44px -18px rgba(0,0,0,.55)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 50%,transparent),transparent 38%,transparent 68%,color-mix(in srgb,var(--accent2) 28%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card h2{font-size:15px;letter-spacing:.01em}
.card h2 small{font-size:12px}
.heroC{display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:26px;background:radial-gradient(520px 260px at 100% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(420px 240px at 0% 100%,color-mix(in srgb,#8aa0ff 14%,transparent),transparent 70%),linear-gradient(165deg,var(--surface2),var(--surface))}
.heroC .hl{display:block;flex:1 1 320px;min-width:0}
.hello{font:600 clamp(26px,5vw,38px)/1.1 var(--font-display);letter-spacing:-.025em;margin:8px 0 12px;background:linear-gradient(100deg,var(--fg) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.heroC .quote{font-size:16px;font-weight:500;color:var(--mute);margin:0;max-width:44ch;line-height:1.45}
.heroC .hr{flex:none;margin-inline:auto}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 60%,transparent);min-width:0;transition:border-color .2s,transform .2s}
.tile:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tile .th{display:flex;align-items:center;gap:10px}
.tile .ti{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 26%,transparent),color-mix(in srgb,var(--accent) 6%,transparent));color:var(--accent)}
.tile .tv{font-size:24px;font-weight:600;line-height:1.1;margin-top:3px;letter-spacing:-.02em}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:0;--p:0%;touch-action:pan-y}
.rng:focus-visible{outline:none}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent)) 0 0/var(--p) 100% no-repeat,var(--line)}
.rng::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}

   so nothing logged offline is lost and a reconnect merges instead of replacing. */
const Q=[];const FAILED=[];let busy=false;
function unsynced(){let n=0;for(const c in state.dirty)n+=Object.keys(state.dirty[c]||{}).length;return n}
function setSync(s){state.sync=s;const el=$('#sync');if(!el)return;
  const n=unsynced();
  const m={idle:['Ready','acc'],saving:['Saving','warn'],saved:[n?n+' change'+(n===1?'':'s')+' not yet synced':'Saved',n?'warn':'good'],failed:['Save failed'+(n?' · '+n+' unsent':'')+'. Tap to retry','bad'],local:['On this device only'+(n?' · '+n+' unsent':''),'warn'],loading:['Loading','acc']}[s]||['Ready','acc'];
  el.className='pill '+m[1];el.innerHTML='<i class="dot"></i><span>'+m[0]+'</span>';el.style.cursor=s==='failed'?'pointer':'default';}
function enqueue(fn){
  saveLocal();
  if(!state.db){setSync('local');return}
  Q.push({fn,tries:0});pump();
}
async function pump(){
  if(busy)return;busy=true;setSync('saving');
  while(Q.length){
    const op=Q[0];
    try{await op.fn();Q.shift()}
    catch(e){op.tries++;if(op.tries>=3){FAILED.push(Q.shift());toast('Some changes did not save. Tap the status pill to retry.')}else await sleep(500*op.tries)}
  }
  busy=false;setSync(FAILED.length?'failed':'saved');
}
function retryFailed(){while(FAILED.length)Q.push(FAILED.shift());pump()}

function mark(col,id,v){(state.dirty[col]=state.dirty[col]||{})[id]=v;saveLocal()}
function unmark(col,id,v){const c=state.dirty[col];if(c&&c[id]===v){delete c[id];saveLocal()}}
function localDoc(col,id){
  if(col==='entries'||col==='todos'||col==='photos'){const arr=col==='entries'?state.entries:col==='todos'?state.todos:state.pics;const x=arr.find(z=>z.id===id);if(!x)return null;const {id:_i,...doc}=x;return JSON.parse(JSON.stringify(doc))}
  if(col==='academics')return state.acad[id]?JSON.parse(JSON.stringify(state.acad[id])):null;
  return null;
}
function wSet(col,id){mark(col,id,'set');enqueue(async()=>{if((state.dirty[col]||{})[id]!=='set')return;const doc=localDoc(col,id);if(doc==null){unmark(col,id,'set');return}await state.db.doc(col+'/'+id).set(doc);unmark(col,id,'set')})}
function wDel(col,id,after){mark(col,id,'del');enqueue(async()=>{if((state.dirty[col]||{})[id]!=='del')return;await state.db.doc(col+'/'+id).delete();if(after)try{await after()}catch(e){}unmark(col,id,'del')})}
/* merge writes (days deep, config shallow): read the server copy, lay our changes on top, write it back */
function wMerge(col,id,patch,deep){
  if(patch){const cur=(state.dirty[col]||{})[id];mark(col,id,deep?deepMerge(cur&&typeof cur==='object'?cur:{},patch):{...(cur&&typeof cur==='object'?cur:{}),...patch})}
  enqueue(async()=>{
    const pt=(state.dirty[col]||{})[id];if(!pt||typeof pt!=='object')return;
    const ref=state.db.doc(col+'/'+id);let cur=null,ok=true;
    try{const sn=await ref.get();const ex=sn&&(typeof sn.exists==='function'?sn.exists():sn.exists);const dt=sn&&(typeof sn.data==='function'?sn.data():sn.data);cur=(ex===false||!dt)?null:dt}catch(e){ok=false}
    const mix=c=>c?(deep?deepMerge(c,pt):{...c,...pt}):JSON.parse(JSON.stringify(pt));
    if(ok)await ref.set(mix(cur));
    else{try{await ref.update(pt)}catch(e){if(e&&/not.?found|invalid/i.test(String(e.code||e.message)))await ref.set(JSON.parse(JSON.stringify(pt)));else throw e}}
    unmark(col,id,pt);
  });
}
function flushDirty(col){
  const d=state.dirty[col]||{};
  Object.keys(d).forEach(id=>{const v=d[id];
    if(v==='set')wSet(col,id);else if(v==='del')wDel(col,id);else if(v&&typeof v==='object')wMerge(col,id,null,col==='days');});
}

const dbSetDay=(date,patch)=>{
  state.days[date]=deepMerge(state.days[date]||{},patch);
  wMerge('days',date,patch,true);
  scheduleRender();
};
function deepMerge(a,b){const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v))?deepMerge(a[k]&&typeof a[k]==='object'?a[k]:{},v):v}return o}
function addEntry(e){
  if(e.type==='water'){
    const legacy=sum(entriesOn(e.date,'water'),x=>+x.ml||0),cur=+day(e.date).water||0,next=Math.max(-legacy,cur+(+e.ml||0)),delta=next-cur;
    if(!delta)return null;
    dbSetDay(e.date,{water:next});
    const wid='water:'+e.date+':'+delta;if(Date.now()-_addedAt>1500)_added=[];_added.push(wid);_addedAt=Date.now();
    return wid;
  }
  const id=uid();const doc={...e,ts:Date.now()};
  state.entries.push({id,...doc});
  if(Date.now()-_addedAt>1500)_added=[];_added.push(id);_addedAt=Date.now();
  wSet('entries',id);
  scheduleRender();return id;
}
function updateEntry(id,patch){
  const e=state.entries.find(x=>x.id===id);if(!e)return;
  Object.assign(e,patch,{upd:Date.now()});
  wSet('entries',id);scheduleRender();
}
function delEntry(id){
  if(String(id).indexOf('water:')===0){const p=String(id).split(':');dbSetDay(p[1],{water:(+day(p[1]).water||0)-(+p[2])});return}
  const ids=[id,...state.entries.filter(e=>e.src===id).map(e=>e.id)];
  state.entries=state.entries.filter(e=>!ids.includes(e.id));
  ids.forEach(x=>wDel('entries',x));scheduleRender();
}
/* splits and money owed */
const r2=n=>Math.round(n*100)/100;
function splitNames(str){
  return String(str||'').split(/\s*(?:,|&|\+|\/|\band\b)\s*/i).map(x=>x.trim()).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+x.slice(1));
}
function parseSplit(str,amt){
  const parts=String(str||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(!parts.length)return {shares:[]};
  const explicit=parts.filter(p=>p.includes(':')),plain=parts.filter(p=>!p.includes(':'));
  const shares=[];let used=0;
  explicit.forEach(p=>{const i=p.lastIndexOf(':');const n=p.slice(0,i).trim(),v=parseFloat(p.slice(i+1));if(n&&v>0){shares.push({person:n,amount:r2(v)});used+=v}});
  const plainN=plain.flatMap(splitNames);
  if(plainN.length){
    const pool=explicit.length?Math.max(0,amt-used):amt;
    const each=pool/(plainN.length+1);
    plainN.forEach(n=>{shares.push({person:n,amount:r2(each)});used+=r2(each)});
  }
  if(used>amt+0.005)return {error:'Shares add up to more than the bill'};
  return {shares};
}
function addExpenseSplit(o){
  const shares=[];
  (o.shares||[]).forEach(x=>{if(!(x&&x.person&&x.amount>0))return;const ns=splitNames(x.person);if(!ns.length)return;const each=r2(x.amount/ns.length);ns.forEach((n,i)=>shares.push({person:n,amount:i===0?r2(x.amount-each*(ns.length-1)):each}))});
  const owed=sum(shares,x=>x.amount);
  const id=addEntry({type:'txn',kind:'expense',amount:o.amount,category:o.category||'Other',account:o.account,note:o.note||'',date:o.date,...(shares.length?{mine:r2(o.amount-owed),split:true}:{})});
  shares.forEach(x=>addEntry({type:'owe',person:x.person,amount:x.amount,note:o.note||'',date:o.date,src:id}));
  return owed;
}
function owedList(all){
  const m={},name={},cnt={};
  state.entries.forEach(e=>{
    const sg=({owe:1,repay:-1,debt:-1,paid:1})[e.type];if(!sg)return;
    const ns=splitNames(e.person);if(!ns.length)return;
    const tot=+e.amount||0,each=r2(tot/ns.length);
    ns.forEach((n,i)=>{
      const k=n.toLowerCase();if(!name[k])name[k]=n;
      m[k]=(m[k]||0)+sg*(i===0?r2(tot-each*(ns.length-1)):each);
      if(e.type==='owe'||e.type==='debt')cnt[k]=(cnt[k]||0)+1;
    });
  });
  return Object.keys(m).map(k=>({p:name[k],v:r2(m[k]),n:cnt[k]||0})).filter(x=>all||Math.abs(x.v)>=0.01).sort((a,b)=>b.v-a.v);
}

  return {kcal:sum(m,e=>+e.kcal||0),p:sum(m,e=>+e.p||0),c:sum(m,e=>+e.c||0),f:sum(m,e=>+e.f||0),nM:m.length,cK:m.filter(e=>kn(e,'c')).length,fK:m.filter(e=>kn(e,'f')).length,water:Math.max(0,sum(entriesOn(d,'water'),e=>+e.ml||0)+(+day(d).water||0))};

function habits(d){
  const cfg=C(),T0=cfg.targets,dd=day(d),tot=totals(d),h=dd.habits||{};
  const ex=examOn(d),T=ex?{...T0,cfaMin:Math.min(T0.cfaMin,30)}:T0;

   {k:'wake',label:'Wake on time',sub:dd.wake?('Woke '+dd.wake+' (target '+cfg.wake+')'):('Target '+cfg.wake),done:!!dd.wake&&tmin(dd.wake)<=tmin(cfg.wake)+15,type:'time'},
   {k:'mobility',label:'Morning mobility',sub:'2.5–5 min after waking',done:!!h.mobility},
   {k:'creatine',label:'Creatine '+T.creatineG+' g',sub:'Around 5 PM',done:!!h.creatine},
   {k:'gym',label:gymNeeded?'Gym: '+PLAN[DOW[parse(d).getDay()]].name:'Active rest',sub:ex&&gymNeeded?'Optional in exam mode':gymNeeded?'About 1 hour':'Walk and steps',done:!!h.gym,optional:ex},
   {k:'cfa',label:'CFA, at least '+T.cfaMin+' min',sub:(dd.cfaMin||0)+' min logged',done:(dd.cfaMin||0)>=T.cfaMin,type:'min'},
   {k:'study',label:'Other academics, at least '+T.studyMin+' min',sub:(dd.studyMin||0)+' min logged',done:(dd.studyMin||0)>=T.studyMin,type:'min'},
   {k:'water',label:'Water '+(T.waterMl/1000)+' L',sub:(tot.water/1000).toFixed(2)+' L so far',done:tot.water>=T.waterMl,type:'auto'},
   {k:'protein',label:'Protein '+T.protein+' g',sub:Math.round(tot.p)+' g so far',done:tot.p>=T.protein,type:'auto'},
   {k:'alcohol',label:'No alcohol',sub:'Tick when the day is clean',done:!!h.alcohol},
   {k:'clean',label:'No porn or masturbation',sub:'Tick when the day is clean',done:!!h.clean},
   {k:'bed',label:'In bed by '+cfg.bed,sub:dd.bed?('Slept '+dd.bed):('Target '+cfg.bed),done:!!dd.bed&&bedOk(dd.bed,cfg.bed),type:'time'}
  ];
  items.forEach(i=>{i.skipped=!!(dd.skip||{})[i.k];i.note=(dd.hnotes||{})[i.k]||'';i.icon=(cfg.hicon||{})[i.k]||HICON[i.k]||''});
  const act=items.filter(i=>!i.skipped&&!(i.optional&&!i.done));const n=act.filter(i=>i.done).length;
  return {items,done:n,total:act.length||1,score:act.length?n/act.length:1,tot};
}

function streakInfo(){
  if(EXC._si)return EXC._si;
  const t=todayStr(),keys=Object.keys(state.days).sort(),start=keys[0]&&keys[0]<t?keys[0]:t;
  let d=start,run=0,best=0,good=0,tok=0,used=0,g=0;
  while(d<=t&&g++<800){
    if(score(d)>=barOf(d)){run++;good++;if(good%7===0)tok=Math.min(2,tok+1);best=Math.max(best,run)}
    else if(d!==t){if(tok>0&&run>0){tok--;used++}else run=0}
    d=addDays(d,1);
  }
  return EXC._si={run,best,tok,used};
}
function streak(){return streakInfo().run}

function acadList(){
  const out=ACAD.map(a=>{const o=state.acad[a.id]||{};return {...a,d:o.date||a.d,done:!!o.done,custom:false}});
  Object.keys(state.acad).forEach(id=>{const o=state.acad[id];if(o&&o.custom)out.push({id,c:o.c||'sec',t:o.t,d:o.date,k:o.k||'Task',done:!!o.done,custom:true})});
  return out;
}
function accountBal(a){
  const cfg=C();const from=cfg.balanceFrom;
  let b=a.opening==null?0:+a.opening;let any=a.opening!=null;
  for(const e of state.entries){
    if(!e.type||e.date<from)continue;
    if(e.type==='txn'){
      if(e.kind==='expense'&&e.account===a.id){b-=+e.amount;any=true}
      else if(e.kind==='income'&&e.account===a.id){b+=+e.amount;any=true}
      else if(e.kind==='transfer'){if(e.account===a.id){b-=+e.amount;any=true}if(e.to===a.id){b+=+e.amount;any=true}}
    }else if(e.type==='repay'&&e.account===a.id){b+=+e.amount;any=true}
    else if(e.type==='paid'&&e.account===a.id){b-=+e.amount;any=true}
    else if(e.type==='adjust'&&e.account===a.id){b+=+e.amount;any=true}
  }
  return {b,any};
}

  const ex=state.entries.filter(e=>e.type==='txn'&&e.kind==='expense'&&e.date.slice(0,7)===ym);
  const by={};ex.forEach(e=>{by[e.category||'Other']=(by[e.category||'Other']||0)+mineOf(e)});
  return {total:sum(ex,mineOf),by,list:ex};
}

  sheet('<h2>'+esc(hlabel(it))+'</h2><p class="muted" style="font-size:13px">'+dlabel(d)+'</p><form class="stack" data-form="habit" data-key="'+k+'"><label class="fld"><span>Note for this day</span><textarea name="note" rows="3" placeholder="Why it slipped, or what worked">'+esc(it.note)+'</textarea></label><div class="fgrid"><label class="fld"><span>Icon (an emoji)</span><input type="text" name="icon" maxlength="4" value="'+esc(it.icon)+'"></label><label class="chip" style="align-self:end"><input type="checkbox" name="skip"'+(it.skipped?' checked':'')+'>Skip today</label></div><label class="chip" style="align-self:flex-start"><input type="checkbox" name="priv"'+(isPriv(k)?' checked':'')+'>Private habit (hide its name when privacy is on)</label><p class="muted" style="font-size:12px;margin:0">A skipped habit is left out of the score and keeps the streak alive. Use it for rest days or travel.</p><div class="row"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" data-act="sheetclose">Cancel</button></div></form>');
}
function mobBlock(d){
  const dow=parse(d).getDay();const key=MOB_BY_DAY[dow];const m=MOB[key];const secs=sum(m.s,x=>x[1]);
  const mm=state.mob;const done=!!(day(d).habits||{}).mobility;
  const nowH=(()=>{const n=new Date(),h=n.getHours();return h<DAYEND?h+24:h})();
  if(!mm.running&&!state.mobOpen&&(done||(d===todayStr()&&nowH>=12)))
    return '<section class="card"><div class="row sp"><div><b>'+esc(m.n)+'</b><div class="muted" style="font-size:12px;margin-top:2px">'+(done?'Done today':'Not done today')+'</div></div><button class="btn sm" data-act="mobopen">Open</button></div></section>';
  let body;
  if(mm.running){const s=m.s[mm.idx];
    body='<div class="stack"><div class="row sp"><span class="lbl">Step '+(mm.idx+1)+' of '+m.s.length+'</span><span class="mono mid">'+mm.left+'s</span></div><div class="mid" style="font-size:20px">'+esc(s[0])+'</div><div class="bar"><i style="width:'+(100-mm.left/s[1]*100)+'%"></i></div><div class="row"><button class="btn sm" data-act="mobskip">Skip</button><button class="btn sm ghost" data-act="mobstop">Stop</button></div></div>';
  }else{
    body='<div class="list">'+m.s.map(x=>'<div class="li" style="padding:7px 0"><div class="m"><b style="font-weight:500">'+esc(x[0])+'</b></div><span class="mono muted" style="font-size:12px">'+x[1]+'s</span></div>').join('')+'</div><div class="row" style="margin-top:12px"><button class="btn pri" data-act="mobstart">'+(done?'Run again':'Start routine')+'</button>'+(done?'<span class="pill good">Done today</span>':'')+'</div>';
  }
  return '<section class="card"><h2>'+esc(m.n)+'<small>'+Math.floor(secs/60)+':'+pad(secs%60)+' min</small></h2>'+body+'</section>';
}

function greet(){const h=new Date().getHours();return h<5?'Still up':h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function svgi(p){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
function slideTile(o){
  const pct=clamp((o.val-o.min)/(o.max-o.min)*100,0,100);
  const done=o.target&&o.val>=o.target;
  return '<div class="tile"><div class="th"><span class="ti">'+svgi(o.icon)+'</span><div style="flex:1;min-width:0"><div class="lbl">'+o.label+'</div><div class="tv mono"><span id="rd-'+o.key+'">'+o.fmt(o.val)+'</span></div></div></div>'+
   '<input type="range" class="rng" id="sl-'+o.key+'" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" value="'+clamp(o.val,o.min,o.max)+'" data-slide="'+o.key+'" style="--p:'+pct+'%" aria-label="'+o.label+'">'+
   '<div class="row sp"><div class="row" style="gap:6px">'+o.btns.map(b=>'<button class="btn sm" data-act="nudge" data-key="'+o.key+'" data-n="'+b+'">'+(b>0?'+':'−')+Math.abs(b)+'</button>').join('')+'</div><span class="pill '+(done?'good':'')+'">'+o.targetTxt+'</span></div></div>';
}

  const T=C().targets,dd=day(d),tot=totals(d);

   slideTile({icon:IC2.water,label:'Water',key:'water',val:Math.max(0,tot.water),min:0,max:5000,step:50,fmt:v=>v.toLocaleString('en-IN')+' ml',target:T.waterMl,targetTxt:(T.waterMl/1000)+' L goal',btns:[-50,50,250]})+
   slideTile({icon:IC2.scale,label:'CFA study',key:'cfaMin',val:dd.cfaMin||0,min:0,max:360,step:1,fmt:mfmt,target:T.cfaMin,targetTxt:T.cfaMin+' min goal',btns:[-1,1,15]})+
   slideTile({icon:IC2.book,label:'Other academics',key:'studyMin',val:dd.studyMin||0,min:0,max:360,step:1,fmt:mfmt,target:T.studyMin,targetTxt:T.studyMin+' min goal',btns:[-1,1,15]})+
   '<div class="tile"><div class="th"><span class="ti">'+svgi(IC2.prot)+'</span><div style="flex:1;min-width:0"><div class="lbl">Protein</div><div class="tv mono">'+Math.round(tot.p)+' g</div></div><span class="pill '+(tot.p>=T.protein?'good':'')+'">'+T.protein+' g goal</span></div><div class="bar" style="height:10px"><i style="width:'+clamp(tot.p/T.protein*100,0,100)+'%"></i></div><div class="row wrap" style="gap:6px"><button class="btn sm" data-act="prot" data-g="10">+10 g</button><button class="btn sm" data-act="prot" data-g="20">+20 g</button><button class="btn sm" data-act="prot" data-g="30">+30 g</button></div></div>'+
  '</div>';

function nudges(mNow){
  const d=todayStr();if(state.date!==d)return '';
  const now=new Date(),m=mNow!=null?mNow:now.getHours()*60+now.getMinutes()+(now.getHours()<DAYEND?1440:0);
  const cfg=C(),T=cfg.targets,tot=totals(d),dd=day(d),h=dd.habits||{},plan=PLAN[DOW[parse(d).getDay()]];
  const L=[];
  if(m>=15*60&&tot.water<1000)L.push(['Water is behind','You are at '+(tot.water/1000).toFixed(1)+' L. Get to 1 L by 3 PM and 3 L by night.']);
  if(m>=17*60&&!h.creatine)L.push(['Creatine','Take your '+T.creatineG+' g now, then tick it.']);
  if(plan.name!=='Rest'&&!h.gym&&m>=tmin(cfg.gymTime)-30&&m<22*60)L.push(['Gym time',plan.name+', about '+plan.min+' min. Log your sets as you go.']);
  if(m>=20*60&&tot.p<T.protein*.6)L.push(['Protein is short',Math.round(tot.p)+' of '+T.protein+' g. A whey scoop or 200 g of curd closes a lot of the gap.']);
  if(m>=22*60+30&&!dd.bed)L.push(['Wind down','Bed target is '+cfg.bed+'. Log it once you are in bed.']);
  if(!L.length)return '';
  return '<section class="card" style="margin-top:14px;border-color:color-mix(in srgb,var(--warn) 45%,var(--line))"><h2>Nudges<small>right now</small></h2><div class="list">'+L.map(x=>'<div class="li"><div class="m"><b>'+esc(x[0])+'</b><span style="white-space:normal">'+esc(x[1])+'</span></div></div>').join('')+'</div></section>';
}
function dayPeriod(){
  if(state.date!==todayStr())return 'day';
  const n=new Date(),h=n.getHours()+n.getMinutes()/60,hh=h<DAYEND?h+24:h;
  return hh>=21.5?'night':hh<11?'morning':'day';
}
function trackersCard(d){return '<section class="card"><h2>Trackers<small>drag the slider, or use the buttons for fine steps</small></h2>'+trackers(d)+'</section>'}
function habitsCard(d,H){return '<section class="card"><h2>Habits<small>'+H.done+' of '+H.total+'</small></h2><div class="hgrid">'+H.items.filter(i=>!['water','protein','cfa','study'].includes(i.k)).map(i=>habitRow(i,d)).join('')+'</div><p class="faint" style="font-size:12px;margin:10px 0 0">Water, protein and study count toward your score from the trackers.</p></section>'}
function bodyCard(d,idp){
  const cfg=C(),T=cfg.targets,dd=day(d),wlast=lastWeight();

}
function comingCard(){
  const up=acadList().filter(a=>a.d&&!a.done&&diff(a.d,todayStr())>=0).sort((a,b)=>a.d<b.d?-1:1).slice(0,5);
  const open=state.todos.filter(t=>!t.done).sort((a,b)=>({high:0,med:1,low:2}[a.pri||'med']-{high:0,med:1,low:2}[b.pri||'med'])).slice(0,4);
  return '<section class="card"><h2>Coming up<small><a href="#" data-act="tab" data-v="study" style="color:var(--accent);text-decoration:none">All</a></small></h2>'+
    (up.length?'<div class="list">'+up.map(a=>dueRow(a)).join('')+'</div>':'<div class="empty">Nothing due soon.</div>')+
    (open.length?'<div class="sep"></div><div class="lbl" style="margin-bottom:6px">To do</div><div class="list">'+open.map(t=>todoRow(t)).join('')+'</div>':'')+'</section>';
}
function noteCard(dd){return '<section class="card"><h2>Daily note</h2><textarea id="note" data-change="note" placeholder="What happened today, what to fix tomorrow">'+esc(dd.note||'')+'</textarea></section>'}
function wakeCard(d){
  const dd=day(d),sh=sleepHours(d);
  if(!dd.wake&&d===todayStr())return '<section class="card hero"><div class="row sp wrap"><div><div class="lbl">Morning</div><h2 style="font-size:20px;margin-top:6px">Start the day</h2></div><button class="btn pri" data-act="stamp" data-key="wake">I’m up</button></div></section>';
  if(!dd.wake)return '';
  return '<section class="card"><div class="row sp wrap"><div><div class="lbl">Woke</div><div class="mid mono" style="margin-top:4px">'+esc(dd.wake)+'</div></div>'+(sh!=null?'<span class="pill">slept about '+sh.toFixed(1)+' h</span>':'')+'</div></section>';

function gymCard(d){

  if(plan.name==='Rest'||done)return '';

}
function weighCard(d){
  const dd=day(d);if(dd.weight!=null)return '';

}
function creatineCard(d){

}
function closeCard(d){
  const T=C().targets,H=habits(d),tot=totals(d),dd=day(d);
  const open=H.items.filter(i=>!i.done&&!i.skipped&&!i.type);
  const wGap=Math.max(0,T.waterMl-tot.water),pGap=Math.max(0,T.protein-tot.p);
  const mins=H.items.filter(i=>i.type==='min'&&!i.done&&!i.skipped);
  const tm=planFor(addDays(d,1))[0];
  let o='<section class="card hero"><h2>Close the day<small>'+H.done+' of '+H.total+' done</small></h2>';
  o+=open.length?'<div class="hgrid">'+open.map(i=>habitRow(i,d)).join('')+'</div>':'<p class="muted" style="margin:0 0 4px;font-size:13px">Every tap habit is done.</p>';
  const gaps=[];
  if(wGap>0)gaps.push('<div class="row sp wrap"><span>Water: <b class="mono">'+Math.round(wGap)+' ml</b> to go</span><span class="row"><button class="btn sm" data-act="nudge" data-key="water" data-n="250">+250</button><button class="btn sm" data-act="nudge" data-key="water" data-n="500">+500</button></span></div>');
  if(pGap>0)gaps.push('<div class="row sp wrap"><span>Protein: <b class="mono">'+Math.round(pGap)+' g</b> to go</span><span class="row"><button class="btn sm" data-act="prot" data-g="20">+20 g</button><button class="btn sm" data-act="prot" data-g="30">+30 g</button></span></div>');
  mins.forEach(i=>gaps.push('<div class="row sp wrap"><span>'+esc(i.k==='cfa'?'CFA':'Other academics')+': <b class="mono">'+Math.max(0,(i.k==='cfa'?(examOn(d)?Math.min(T.cfaMin,30):T.cfaMin):T.studyMin)-(dd[i.k==='cfa'?'cfaMin':'studyMin']||0))+' min</b> to go</span><span class="row"><button class="btn sm" data-act="nudge" data-key="'+(i.k==='cfa'?'cfaMin':'studyMin')+'" data-n="15">+15</button></span></div>'));
  if(gaps.length)o+='<div class="sep"></div><div class="stack" style="gap:10px;font-size:14px">'+gaps.join('')+'</div>';
  if(!dd.bed&&d===todayStr())o+='<div class="sep"></div><div class="row sp wrap"><span>Target bed time <b class="mono">'+esc(C().bed)+'</b></span><button class="btn pri" data-act="stamp" data-key="bed">In bed now</button></div>';
  if(tm)o+='<div class="sep"></div><div class="lbl">Tomorrow starts with</div><div style="margin-top:4px;font-size:14px"><b>'+esc(cshort(tm.c))+' · '+tm.min+' min</b><div class="muted" style="font-size:12px">'+esc(tm.label)+'</div></div>';
  o+='<div class="sep"></div><div class="stack"><label class="fld"><span>What went well today?</span><input type="text" data-change="well" value="'+esc(dd.well||'')+'" maxlength="160"></label><label class="fld"><span>What needs attention tomorrow?</span><input type="text" data-change="tmr" value="'+esc(dd.tmr||'')+'" maxlength="160"></label><div class="row wrap"><button class="btn'+(dd.reviewed?'':' pri')+'" data-act="reviewed">'+(dd.reviewed?'Reviewed. Tap to undo':'Mark day reviewed')+'</button><span class="muted" style="font-size:12px">Optional. Skipping it never changes your score.</span></div></div>';
  return o+'</section>';
}
function examCard(d){
  const ups=acadList().filter(a=>a.d&&!a.done&&(a.k==='Exam'||a.k==='Test'||a.k==='Submission')&&diff(a.d,d)>=0).sort((a,b)=>a.d<b.d?-1:1).slice(0,4);
  if(!ups.length)return '';
  const f=ups[0],n=diff(f.d,d);
  return '<section class="card hero"><div class="lbl">Exam mode</div><div class="row sp wrap" style="margin-top:8px;align-items:flex-end"><div class="big mono">'+(n===0?'Today':n+' d')+'</div><span class="pill warn">'+cdot(f.c)+esc(cshort(f.c))+' · '+esc(f.k)+'</span></div><p style="margin:8px 0 0;font-size:14px">'+esc(f.t)+'</p>'+(ups.length>1?'<div class="list" style="margin-top:10px">'+ups.slice(1).map(a=>'<div class="li" style="padding:7px 0"><div class="m"><b style="font-weight:500">'+esc(a.t)+'</b><span>'+cdot(a.c)+esc(cshort(a.c))+' · '+dlabel(a.d)+'</span></div><span class="days">'+diff(a.d,d)+' d</span></div>').join('')+'</div>':'')+'<p class="faint" style="font-size:12px;margin:10px 0 0">CFA eases to 30 min, the gym is optional, and the streak bar drops to 60%. Poker is hidden.</p></section>';
}
function vToday(){
  const d=state.date,cfg=C(),T=cfg.targets,H=habits(d),dd=day(d),tot=totals(d);
  const wk=weekIndex(d),plan=PLAN[DOW[parse(d).getDay()]];
  const planTxt=wk<1?('Plan starts '+dlabel(cfg.planStart)):(wk>cfg.planWeeks?'Plan complete':('Week '+wk+' · '+plan.name));
  const nx=acadList().filter(a=>a.d&&!a.done&&diff(a.d,todayStr())>=0).sort((a,b)=>a.d<b.d?-1:1)[0];
  const per=dayPeriod(),ex=examOn(d),sun=parse(d).getDay()===0;
  const chipBtn=(txt,act,attrs,good)=>'<button class="pill'+(good?' good':'')+'" data-act="'+act+'" '+attrs+'>'+txt+'</button>';
  const mins=(dd.studyMin||0);
  const hero='<section class="card heroC slim'+(H.score>=1?' full':'')+'"><div class="hl"><div class="lbl">'+dlabel(d)+' · '+({morning:'Morning',day:'Daytime',night:'Night'})[per]+(ex?' · exam mode':'')+'</div><h2 class="hello">'+greet()+', Pratham</h2>'+
    '<div class="chips" style="margin-top:12px"><span class="pill acc">'+esc(planTxt)+'</span><span class="pill">'+streak()+' day streak'+(streakInfo().best>streak()?' · best '+streakInfo().best:'')+'</span>'+(streakInfo().tok?'<span class="pill acc" title="A missed day is covered automatically. You earn one for every 7 good days, up to 2.">'+streakInfo().tok+' freeze'+(streakInfo().tok>1?'s':'')+'</span>':'')+([3,7,14,30].includes(streak())?'<span class="pill good">★ '+streak()+'-day streak milestone</span>':'')+(H.score>=barOf(d)&&H.score<1?'<span class="pill good">Streak safe</span>':'')+'<button class="chip" data-act="tab" data-v="progress">Review ›</button>'+(nx?'<span class="pill warn">'+esc(nx.t.length>26?nx.t.slice(0,25)+'…':nx.t)+' · '+(diff(nx.d,todayStr())===0?'today':diff(nx.d,todayStr())+' d')+'</span>':'')+'</div>'+
    '<div class="chips" style="margin-top:8px">'+chipBtn('Water '+(tot.water/1000).toFixed(2)+' / '+(T.waterMl/1000)+' L · +250','nudge','data-key="water" data-n="250" aria-label="Add 250 ml of water"',tot.water>=T.waterMl)+chipBtn('Protein '+Math.round(tot.p)+' / '+T.protein+' g · +20','prot','data-g="20" aria-label="Add 20 g protein"',tot.p>=T.protein)+'</div></div><div class="hr">'+ring(H.score,'var(--accent)',Math.round(H.score*100)+'%',(H.total-H.done)?(H.total-H.done)+' habits left':'all done',96)+'</div></section>';
  const reg={
    exam:()=>ex?examCard(d):'',wake:()=>wakeCard(d),plan:()=>planToday(),mob:()=>mobBlock(d),rate:()=>rateCard(),weigh:()=>weighCard(d),gym:()=>gymCard(d),
    next:()=>nextCard(),creatine:()=>creatineCard(d),close:()=>closeCard(d),week:()=>weekCard(),
    top3:()=>top3Card(),trackers:()=>trackersCard(d),habits:()=>habitsCard(d,H),body:()=>bodyCard(d),coming:()=>comingCard(),note:()=>noteCard(dd),life:()=>lifeTile()
  };
  let top=per==='morning'?['top3','wake','plan','mob','rate','weigh','gym']:per==='night'?['close','rate']:['top3','plan','next','gym','creatine'];
  if(ex&&per==='morning')top=['top3','plan','wake','mob','rate','weigh','gym'];
  if(sun)top.unshift('week');
  top.unshift('exam');
  const restKeys=['top3','trackers','habits','rate','body','mob','plan','coming','life','note','week'].filter(k=>!top.includes(k));
  const lk=k=>{const o=LOOK.order.indexOf(k);return o<0?999:o};
  const lf=a=>{const ex0=a.filter(k=>k==='exam'),r=a.filter(k=>k!=='exam'&&!LOOK.hidden.includes(k));if(LOOK.order.length){const idx=r.map((k,i)=>[k,i]);idx.sort((x,y)=>(lk(x[0])-lk(y[0]))||(x[1]-y[1]));return ex0.concat(idx.map(x=>x[0]))}return ex0.concat(r)};
  const top2=lf(top),rest2=lf(restKeys);
  const topHtml=top2.map(k=>reg[k]()).filter(Boolean).join('');
  const restHtml=rest2.map(k=>reg[k]()).filter(Boolean).join('');
  return dateNav()+hero+
    '<div class="grid w2" style="margin-top:14px">'+topHtml+'</div>'+'<div style="margin-top:14px">'+nudges()+'</div>'+
    '<details class="fold" data-det="alltoday" style="margin-top:14px"'+(state.det.alltoday?' open':'')+'><summary>All of today</summary><div class="foldbody"><div class="grid w2" style="margin-top:0;padding:0 14px 14px">'+restHtml+'</div></div></details>';
}

function vWidget(){
  const d=todayStr(),cfg=C(),T=cfg.targets,H=habits(d),tot=totals(d),dd=day(d);

async function shotPick(f,quiet){

    const th=document.createElement('canvas'),ts=Math.min(1,320/Math.max(cv.width,cv.height));th.width=Math.max(1,Math.round(cv.width*ts));th.height=Math.max(1,Math.round(cv.height*ts));th.getContext('2d').drawImage(cv,0,0,th.width,th.height);

async function shotRead(){
  const S=state.shot;if(!S||!S.items.length||S.busy||!state.sampleFn)return;
  S.busy=true;S.msg='';shotSheet();
  try{
    const r=await state.sampleFn.json(shotPrompt(S.kind),{modelTier:'default',cache:false,images:S.items.map(x=>x.blob)});
    const num=(v,mx)=>{const n=typeof v==='number'?v:parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)&&n>=0&&n<=mx?Math.round(n):null};
    let dt=r&&/^\d{4}-\d{2}-\d{2}$/.test(String(r.date||''))?String(r.date):'';
    if(dt&&(diff(dt,todayStr())>0||diff(dt,todayStr())<-30))dt='';
    const note=String((r&&r.note)||'').slice(0,160);
    if(S.kind==='sleep'){
      const tm=v=>{const m=/(\d{1,2})[:.](\d{2})(?::\d{2})?\s*([ap])?\.?m?\.?/i.exec(String(v==null?'':v).trim());if(!m)return '';let h=+m[1];const mi=+m[2];if(m[3]){const pm=m[3].toLowerCase()==='p';if(h===12)h=pm?12:0;else if(pm)h+=12}return h<24&&mi<60?String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'):''};
      const dur=v=>{if(typeof v==='number')return v;const t=String(v==null?'':v);const m=/(\d+(?:\.\d+)?)\s*h[a-z]*\s*(?:(\d+)\s*m)?/i.exec(t);if(m)return Math.round(+m[1]*60+(+m[2]||0));return t};
      let sm=num(dur(r&&r.asleepMinutes),1000);if(sm!=null&&sm<30)sm=null;
      const bed=tm(r&&r.bedtime),wake=tm(r&&r.wakeTime),app=num(r&&r.score,100);
      if(!bed&&!wake&&sm==null&&app==null)throw {code:'empty'};
      S.res={bed,wake,sleepMin:sm,app,date:dt||state.date,note};
    }else{
      const steps=num(r&&r.steps,100000),burned=num(r&&r.caloriesBurned,20000);
      if(steps==null&&burned==null)throw {code:'empty'};
      S.res={steps,burned,date:dt||state.date,note};
    }
  }catch(err){
    S.msg=(err&&err.code==='empty')?'I could not find the numbers in that screenshot. Try one that shows the daily totals, or type them in.':(err&&err.code==='images_unavailable')?'This view cannot send images. Open the dashboard in your browser (Safari or your Mac) to use screenshots.':(err&&err.code==='image_rejected')?'That image was rejected (wrong type, unreadable or too large). Try another one.':(err&&err.code==='not_granted')?'Permission was declined, so reading screenshots is off for this visit.':'Something went wrong reading it ('+String((err&&(err.code||err.message))||'unknown').slice(0,60)+'). Try again, or type the numbers in.';
  }
  S.busy=false;shotSheet();
}

/* ===== sleep score ===== */
const cdiffM=(a,b)=>Math.abs((((a-b+720)%1440)+1440)%1440-720);
function sleepInfo(d){
  const dd=day(d),cfg=C();let h=dd.sleepMin>=30?dd.sleepMin/60:sleepHours(d);
  if(h==null)return null;
  const b=tmin(day(addDays(d,-1)).bed),w=tmin(dd.wake),tb=tmin(cfg.bed),tw=tmin(cfg.wake);
  const tgt=+cfg.sleepTarget>0?+cfg.sleepTarget:8;
  let got=60*clamp(h/tgt,0,1),max=60;
  if(h>tgt+1.5)got-=Math.min(15,(h-tgt-1.5)*6);
  if(b!=null&&tb!=null){got+=20*clamp(1-cdiffM(b,tb)/120,0,1);max+=20}
  if(w!=null&&tw!=null){got+=20*clamp(1-cdiffM(w,tw)/120,0,1);max+=20}
  const score=Math.round(clamp(got/max,0,1)*100);
  return {h,score,app:dd.sleepApp!=null?dd.sleepApp:null,label:score>=85?'Great':score>=70?'Good':score>=55?'Fair':'Poor'};
}
function sleepEffect(){
  const t=todayStr(),rows=[];
  for(let i=1;i<=75;i++){const d=addDays(t,-i),s=sleepInfo(d);if(!s)continue;rows.push({s:s.score,hs:score(d),m:day(d).mood||null})}
  const avg=(l,f)=>{const v=l.map(f).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const good=rows.filter(r=>r.s>=75),poor=rows.filter(r=>r.s<60);
  return {good:{n:good.length,h:avg(good,r=>r.hs),m:avg(good,r=>r.m)},poor:{n:poor.length,h:avg(poor,r=>r.hs),m:avg(poor,r=>r.m)},ok:good.length>=3&&poor.length>=3,total:rows.length};
}
function effLine(s,e){
  const f=x=>x==null?'–':Math.round(x*100)+'%';
  if(s.score>=75)return 'After nights this good you finish about '+f(e.good.h)+' of your habits the next day, against '+f(e.poor.h)+' after poor nights.';
  if(s.score<60)return 'After nights like this you finish about '+f(e.poor.h)+' of your habits, against '+f(e.good.h)+' after good sleep.';
  return 'Good nights (75 and up) lead to '+f(e.good.h)+' of habits done, poor nights (under 60) to '+f(e.poor.h)+'.';
}
function sleepLine(d){
  const s=sleepInfo(d),e=s?sleepEffect():null;

   (s&&s.app!=null?'<p class="faint" style="font-size:12px;margin:6px 0 0">Your Fitbit shows '+s.app+'.</p>':'')+(e&&e.ok?'<p class="muted" style="font-size:13px;margin:8px 0 0">'+effLine(s,e)+'</p>':'');

function sleepCard(){
  const t=todayStr(),rows=[];for(let i=13;i>=0;i--){const d=addDays(t,-i);rows.push({d,s:sleepInfo(d)})}
  const have=rows.filter(r=>r.s),avg=have.length?Math.round(have.reduce((a,r)=>a+r.s.score,0)/have.length):null;
  const bw=300/14;
  const bars=rows.map((r,i)=>r.s?'<rect x="'+(i*bw+3).toFixed(1)+'" y="'+(76-r.s.score*.7).toFixed(1)+'" width="'+(bw-6).toFixed(1)+'" height="'+Math.max(1,r.s.score*.7).toFixed(1)+'" rx="3" style="fill:'+(r.s.score>=75?'var(--good)':r.s.score>=60?'var(--accent)':'var(--warn)')+'" opacity=".85"><title>'+dlabel(r.d)+': '+r.s.score+'</title></rect>':'<rect x="'+(i*bw+3).toFixed(1)+'" y="74" width="'+(bw-6).toFixed(1)+'" height="2" rx="1" style="fill:var(--line2)"/>').join('');

function confetti(){
  try{
    if(C().fx===false)return;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const old=document.getElementById('fxc');if(old)old.remove();
    const cv=document.createElement('canvas');cv.id='fxc';cv.className='fx';cv.setAttribute('aria-hidden','true');
    const W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;document.body.appendChild(cv);
    const g=cv.getContext('2d'),cols=['#c9a86a','#dcc28a','#f1ece2','#9bbd95','#a8473f','#e0b25a'];
    const ps=Array.from({length:70},()=>({x:W/2+(Math.random()-.5)*80,y:H*.6,vx:(Math.random()-.5)*10,vy:-(6+Math.random()*9),s:4+Math.random()*5,c:cols[Math.random()*cols.length|0],r:Math.random()*6.28,vr:(Math.random()-.5)*.4}));
    const t0=performance.now();
    (function f(now){const t=(now||performance.now())-t0;g.clearRect(0,0,W,H);
      ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-t/1600);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});

function checkWins(){
  try{
    const t=todayStr(),T=C().targets,tot=totals(t),H=habits(t),dd=day(t);
    const w={water:T.waterMl>0&&tot.water>=T.waterMl,protein:T.protein>0&&tot.p>=T.protein,steps:T.steps>0&&(dd.steps||0)>=T.steps,habits:H.total>0&&H.score>=1};
    const sk=streak();if([3,7,14,21,30,50,100].includes(sk)&&H.score>=.7)w['streak'+sk]=true;
    let rec=state.wins;
    if(!rec||rec.d!==t){rec=null;try{const r=JSON.parse(localStorage.getItem('lifeDash.wins')||'null');if(r&&r.d===t)rec=r}catch(e){}}
    if(!rec)rec={d:t,k:{}};state.wins=rec;
    const fresh=Object.keys(w).filter(k=>w[k]&&!rec.k[k]);
    fresh.forEach(k=>{rec.k[k]=1});
    if(fresh.length){try{localStorage.setItem('lifeDash.wins',JSON.stringify(rec))}catch(e){}}
    if(fresh.length&&Date.now()-(state.lastAct||0)<1500){
      const k=fresh.find(x=>x.startsWith('streak'))||fresh.find(x=>x==='habits')||fresh[0];
      const msg={water:'Water goal hit',protein:'Protein goal hit',steps:'Steps goal hit',habits:'Every habit done today'}[k]||(k.replace('streak','')+' day streak');
      celebrate(msg);
    }
  }catch(e){}
}

/* ===== wallpaper engine ===== */
const WALL={scene:null,name:null,raf:0,last:0,g:null,cv:null,sw:null,busy:0};
function wallFor(){const v=state.view;return v==='train'?'gym':v==='fuel'?'table':v==='money'?'arch':v==='study'?'study':(v==='progress'||v==='life')?'ridge':(['coast','city','ridge'].includes(LOOK.wall)?LOOK.wall:'coast')}
function wallPrep(name){const S=SCENES[name];if(!S)return null;if(!S.base){const c=mkc(SW,SH);S.data=S.paint(c.getContext('2d'),SW,SH);S.base=c}return S}
function wallFrame(t){const S=WALL.scene;if(!S||!WALL.g)return;const g=WALL.g;g.globalAlpha=1;g.globalCompositeOperation='source-over';g.drawImage(S.base,0,0);S.dyn&&S.dyn(g,t,S.data,SW,SH)}
function wallLoop(now){WALL.raf=requestAnimationFrame(wallLoop);if(now-WALL.last<41)return;WALL.last=now;wallFrame(now/1000)}
function wallStop(){if(WALL.raf){cancelAnimationFrame(WALL.raf);WALL.raf=0}}
function wallApply(){
  const cw=document.getElementById('crestw');if(cw&&!cw.firstChild)cw.innerHTML=CREST;
  const cv=WALL.cv||(WALL.cv=document.getElementById('wall'));if(!cv)return;
  if(!WALL.g){cv.width=SW;cv.height=SH;WALL.g=cv.getContext('2d')}
  const off=LOOK.motion==='off';document.body.classList.toggle('nowall',off);
  if(off||state.view==='widget'){wallStop();return}
  const name=wallFor();
  if(name!==WALL.name){
    WALL.name=name;const tk=++WALL.busy;cv.style.opacity=0;
    setTimeout(()=>{if(tk!==WALL.busy)return;WALL.scene=wallPrep(name);cv.style.opacity=WALLOP();wallFrame(26)},WALL.scene?200:0);
  }
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const live=(LOOK.motion==='live'||(LOOK.motion==='mix'&&state.view==='today'))&&!reduce&&!document.hidden;
  if(live&&!WALL.raf)WALL.raf=requestAnimationFrame(wallLoop);
  if(!live){wallStop();if(WALL.scene)wallFrame(26)}
  document.documentElement.dataset.motion=live?'live':'still';
}
document.addEventListener('visibilitychange',()=>{try{wallApply()}catch(e){}});

  const lab=Object.fromEntries(LOOK_CARDS);

async function estimateMeal(text){
  const e=state.est;if(e.busy||!state.sampleFn||(!text.trim()&&!state.photos.files.length))return;
  e.busy=true;e.msg='';e.items=null;e.text=text;render();
  try{
    const ph=state.photos.files.slice();const r=await state.sampleFn.json(maxPrompt(text,ph.length),ph.length?{modelTier:'default',cache:false,images:ph}:{modelTier:'default',cache:false});
    const arr=Array.isArray(r.items)?r.items:[];
    if(!arr.length)throw {code:'empty'};
    e.items=arr.map(it=>({name:String(it.name||'Item'),qty:String(it.qty||''),kcal:Math.round(+it.kcal||0),p:+(+it.p||0).toFixed(1),c:+(+it.c||0).toFixed(1),f:+(+it.f||0).toFixed(1),basis:it.basis==='ref'?'ref':'estimate',note:String(it.note||'')}));
    e.summary=String(r.summary||'');
  }catch(err){
    e.msg=(err&&(err.code==='image_rejected'||err.code==='images_unavailable'))?'Could not read the photo. Try another one, or type what you ate.':(err&&err.code==='not_granted')?'Permission was declined, so estimates are off for this visit. Enter numbers yourself below.':(err&&err.code==='rate_limited')?'Too many requests. Wait a moment and try again.':'Could not work that out. Add quantities and try again, or enter numbers yourself.';
  }
  e.busy=false;render();
}

const nextYm=ym=>{let [y,m]=ym.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};

function runRecurring(){
  const list=C().recurring||[];if(!list.length)return;
  const t=todayStr(),cur=t.slice(0,7);
  list.forEach(r=>{
    if(r.paused)return;let ym=r.from||cur,g=0;
    while(ym<=cur&&g++<36){
      const dt=recDate(ym,r.day);if(dt>t)break;
      if(!(r.skip||[]).includes(ym)&&!state.entries.some(e=>e.rec===r.id&&e.date.slice(0,7)===ym))
        addEntry({type:'txn',kind:r.kind==='income'?'income':'expense',amount:+r.amount,category:r.kind==='income'?'Income':r.category,account:r.account,note:r.name+' (recurring)',date:dt,rec:r.id});
      ym=nextYm(ym);
    }
  });
  _added=[];
}

function pkGroup(){

}
function setGroupBal(person,target){

}
const LINE_EFFECT={owe:1,paid:1,repay:-1,debt:-1};
function personLines(p){
  const k=p.toLowerCase(),out=[];
  state.entries.forEach(e=>{
    const sg=LINE_EFFECT[e.type];if(!sg)return;
    const ns=splitNames(e.person);const idx=ns.findIndex(n=>n.toLowerCase()===k);if(idx<0)return;
    const tot=+e.amount||0,each=r2(tot/ns.length),amt=idx===0?r2(tot-each*(ns.length-1)):each;
    out.push({e,amt,eff:sg*amt,shared:ns.length>1?ns.filter((n,i)=>i!==idx).join(', '):''});
  });
  out.sort((a,b)=>a.e.date<b.e.date?-1:a.e.date>b.e.date?1:(a.e.ts||0)-(b.e.ts||0));
  let bal=0;out.forEach(l=>{bal=r2(bal+l.eff);l.bal=bal});
  return out.reverse();
}

function calcExp(f){
  const E=f.elements,total=parseFloat(E.amount.value);
  if(!(total>0))return {error:'Enter the amount'};
  const payer=E.payer.value,mode=E.mode.value;
  const payerName=payer==='other'?(splitNames(E.payername.value)[0]||''):'';
  if(payer==='other'&&!payerName)return {error:'Enter who paid'};
  const rows=[...f.querySelectorAll('.sprow:not(.you)')].map(r=>({names:splitNames(r.querySelector('[name=pn]').value),v:parseFloat(r.querySelector('.pv').value)})).filter(r=>r.names.length);
  let shares=[],mine=total,text='';
  if(mode==='equal'){
    const names=rows.flatMap(r=>r.names),incl=payer==='other'||E.incl.checked;
    const count=names.length+(incl?1:0)+(payer==='other'?1:0);
    if(count<1)return {error:'Add at least one person'};
    const each=r2(total/count);
    if(payer==='other'){mine=each;text='₹'+each.toFixed(2)+' each · '+count+' people'}
    else{shares=names.map(n=>({person:n,amount:each}));mine=incl?r2(total-each*names.length):0;if(!incl&&shares.length)shares[0].amount=r2(total-each*(shares.length-1));text='₹'+each.toFixed(2)+' each · '+count+' people'}
  }else if(mode==='exact'||mode==='pct'){
    const pct=mode==='pct';
    if(payer==='other'){const my=parseFloat(E.myshare.value);if(isNaN(my)||my<0)return {error:'Enter your share'};mine=pct?r2(total*my/100):my;if(mine>total+0.005)return {error:'Your share is more than the bill'}}
    else{
      let used=0;rows.forEach(r=>{if(isNaN(r.v)||r.v<0)return;const amt=pct?total*r.v/100:r.v,each=amt/r.names.length;r.names.forEach(n=>shares.push({person:n,amount:r2(each)}));used+=amt});
      if(used>total+0.005)return {error:pct?'Percentages add up to more than 100':'Amounts add up to more than the bill'};
      mine=r2(total-sum(shares,x=>x.amount));
    }
  }
  if(payer==='other')text=text||('Your share ₹'+mine.toFixed(2));
  return {total,payer,payerName,mode,shares,mine,text,owedSum:sum(shares,x=>x.amount)};
}
function syncExp(f){
  const E=f.elements,payer=E.payer.value,mode=E.mode.value,other=payer==='other';
  f.querySelectorAll('[data-only]').forEach(el=>{el.hidden=el.dataset.only!==payer});
  $('#spbox').hidden=mode==='none';
  $('#sprows').hidden=other&&mode!=='equal'&&mode!=='none';
  $('#spadd').hidden=$('#sprows').hidden;
  f.querySelectorAll('.pv').forEach(el=>{el.hidden=mode==='equal';el.placeholder=mode==='pct'?'%':'₹'});
  $('#incl-wrap').hidden=!(mode==='equal'&&!other);
  $('#myshare').hidden=!(other&&(mode==='exact'||mode==='pct'));
  $('#youval').hidden=!(!other&&(mode==='exact'||mode==='pct'));
  if(E.myshare)E.myshare.placeholder=mode==='pct'?'Your %':'Your ₹';
  const r=calcExp(f),el=$('#spsum');
  let t='';
  if(r.error){t=r.error;el.className='spsum err'}
  else{
    el.className='spsum';
    if(r.payer==='other')t='You owe '+r.payerName+' ₹'+r.mine.toFixed(2);
    else if(r.mode==='none')t='';
    else t='Your share ₹'+r.mine.toFixed(2)+(r.owedSum?' · owed to you ₹'+r.owedSum.toFixed(2):'')+(r.text&&r.mode==='equal'?' · '+r.text:'');
    if(!$('#youval').hidden)$('#youval').textContent='₹'+r.mine.toFixed(2);
  }
  if(r.error&&r.error==='Enter the amount')t='';
  el.textContent=t;el.hidden=!t;
}

function chart(){
  const cfg=C();const pts=Object.keys(state.days).filter(k=>state.days[k].weight!=null).sort().map(k=>({d:k,w:+state.days[k].weight}));
  const W=640,H=230,L=40,R=14,Tp=14,B=28;
  const t0=cfg.planStart,t1=addDays(t0,cfg.planWeeks*7-1);const span=diff(t1,t0);
  const lo=Math.floor(Math.min(cfg.goalWeight-1,...pts.map(p=>p.w)));const hi=Math.ceil(Math.max(cfg.startWeight+.5,...pts.map(p=>p.w)));
  const x=d=>L+(clamp(diff(d,t0),0,span)/span)*(W-L-R);const y=v=>Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B);
  let g='';for(let v=lo;v<=hi;v+=1){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  for(let i=0;i<=cfg.planWeeks;i+=2){const dd=addDays(t0,i*7);g+='<text x="'+x(dd)+'" y="'+(H-8)+'" text-anchor="middle">W'+(i+1>cfg.planWeeks?cfg.planWeeks:i+1)+'</text>'}
  const target='<line x1="'+x(t0)+'" y1="'+y(cfg.startWeight)+'" x2="'+x(t1)+'" y2="'+y(cfg.goalWeight)+'" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="5 5"/>';
  const goal='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(cfg.goalWeight)+'" y2="'+y(cfg.goalWeight)+'" stroke="var(--good)" stroke-width="1" stroke-dasharray="2 4"/><text x="'+(W-R)+'" y="'+(y(cfg.goalWeight)-6)+'" text-anchor="end" style="fill:var(--good)">goal '+cfg.goalWeight+'</text>';
  let line='';if(pts.length){const path=pts.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+' '+y(p.w).toFixed(1)).join(' ');
    line='<path d="'+path+' L'+x(pts[pts.length-1].d).toFixed(1)+' '+(H-B)+' L'+x(pts[0].d).toFixed(1)+' '+(H-B)+'Z" fill="var(--glow)"/><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+pts.map((p,i)=>'<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="'+(i===pts.length-1?5:3)+'" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>').join('');
    const lp=pts[pts.length-1];line+='<text x="'+clamp(x(lp.d),L+20,W-R-20)+'" y="'+(y(lp.w)-10)+'" text-anchor="middle" style="fill:var(--accent)">'+lp.w+'</text>'}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight against the plan">'+g+target+goal+line+'</svg>';
}
function heatCard(){

  }

const KIND_W={Exam:3,Test:2,Submission:1.8,Interviews:1.2};
function planVerb(a,n){
  if(a.k==='Exam')return n>10?'Reading and notes':'Revision and past questions';
  if(a.k==='Submission')return n>5?'Draft':n>0?'Finish and proofread':'Submit';
  if(a.k==='Test')return n>2?'Prep':'Final revision';
  if(a.k==='Interviews')return 'Conduct interviews';
  return 'Work on';
}
function planFor(d,items){
  items=items||acadList().filter(a=>a.d&&!a.done);
  const base=C().planMin||120;
  const hol=MILESTONES.find(m=>m.d===d&&/holiday|Dussehra|Deepawali|Jayanti/i.test(m.t));
  const total=Math.round(base*(hol?.5:1)/30)*30;
  const live=items.filter(a=>diff(a.d,d)>=0);
  if(!live.length||total<=0)return [];
  const sc={},best={};
  live.forEach(a=>{const n=diff(a.d,d);let w=KIND_W[a.k]||1;
    if(a.k==='Exam'&&n>21)w*=.25;else if(a.k!=='Exam'&&n>10)w*=.35;
    const v=w/(n+2);sc[a.c]=(sc[a.c]||0)+v;if(!best[a.c]||v>best[a.c].v)best[a.c]={v,a,n}});
  const blocks={};let left=total/30;
  while(left-->0){const c=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];blocks[c]=(blocks[c]||0)+30;sc[c]*=.45}
  return Object.keys(blocks).map(c=>{const {a,n}=best[c];return {c,min:blocks[c],label:planVerb(a,n)+': '+a.t,n}}).sort((x,y)=>y.min-x.min);
}

const CAT_HINTS=[[/lunch|dinner|breakfast|food|snack|chai|coffee|meal|swiggy|zomato|cafe|biryani|pizza|burger/i,'Food'],[/grocer|vegetable|fruit|milk|kirana|bigbasket|blinkit|zepto/i,'Groceries'],[/uber|ola\b|auto|cab|metro|bus|train|fuel|petrol|rapido|flight/i,'Transport'],[/netflix|spotify|prime|subscription|youtube|icloud/i,'Subscriptions'],[/book|print|xerox|course|notes|exam|fee/i,'Academics'],[/gym|protein|whey|creatine|doctor|medicine|pharmacy/i,'Health and gym'],[/movie|game|concert|party|club/i,'Entertainment'],[/rent|bill|electric|wifi|recharge|mobile/i,'Bills'],[/poker|casino/i,'Poker and gambling'],[/shirt|shoes|amazon|myntra|clothes/i,'Shopping']];
function guessCat(t,cats){for(const [r,c] of CAT_HINTS)if(r.test(t)&&cats.includes(c))return c;return cats.includes('Other')?'Other':cats[0]}
function lastAcct(){const e=state.entries.filter(x=>x.type==='txn'&&x.kind==='expense'&&x.account).sort((a,b)=>b.ts-a.ts)[0];return e?e.account:''}
function guessAcct(t,cfg){const l=t.toLowerCase();for(const a of cfg.accounts){const nm=a.name.toLowerCase();if(l.includes(nm)||new RegExp('\\b'+a.id+'\\b').test(l)||(a.kind==='credit'&&/\bcc\b|credit card/.test(l))||(a.kind==='cash'&&/\bcash\b/.test(l)))return a.id}return ''}
function localParse(q){
  const t=q.trim(),cfg=C(),n='(\\d+(?:\\.\\d+)?)';let m;
  if(m=t.match(new RegExp('^(?:water|drank|drink)\\s+'+n+'\\s*(ml|l|ltr|litres?|liters?)?\\b','i'))){let v=+m[1];const u=(m[2]||'').toLowerCase();if((u&&u!=='ml')||(!u&&v<=10))v*=1000;return {reply:'Water '+Math.round(v)+' ml.',entries:[{type:'water',ml:Math.round(v)}]}}
  if(m=t.match(new RegExp('^(?:weight|wt|weighed|weigh)\\s*(?:in|is)?\\s*'+n,'i')))return {reply:'Weight '+m[1]+' kg.',entries:[{type:'weight',kg:+m[1]}]};
  if(m=t.match(new RegExp('^steps?\\s+(?:is\\s+)?'+n+'$','i')))return {reply:'Steps '+m[1]+'.',entries:[{type:'steps',v:+m[1]}]};
  if(m=t.match(new RegExp('^(?:calories\\s+burned|burned|kcal\\s+burned|burnt)\\s+(?:is\\s+)?'+n+'\\s*(?:kcal|cal|calories)?$','i')))return {reply:'Calories burned '+m[1]+'.',entries:[{type:'burned',v:+m[1]}]};
  if(m=t.match(new RegExp('^cfa\\s+'+n,'i')))return {reply:'CFA '+m[1]+' min.',entries:[{type:'cfa',min:+m[1]}]};
  if(m=t.match(new RegExp('^(?:study|studied|academics|reading)\\s+'+n,'i')))return {reply:'Study '+m[1]+' min.',entries:[{type:'study',min:+m[1]}]};
  if(m=t.match(new RegExp('^protein\\s+'+n,'i')))return {reply:'Protein '+m[1]+' g.',entries:[{type:'protein',g:+m[1]}]};
  if(m=t.match(new RegExp('^(?:paid|spent|expense|exp|bought)\\s+(?:rs\\.?|₹)?\\s*'+n+'\\s*(?:rs|₹|inr)?\\s*(?:for|on|to|at)?\\s*(.*)$','i'))){const rest=m[2]||'',g=guessAcct(rest,cfg);return {reply:'Expense '+inr2(+m[1])+'.',entries:[{type:'expense',amount:+m[1],category:guessCat(rest,cfg.categories),account:g||lastAcct(),guess:!g,note:rest.trim()}]}}
  if(m=t.match(new RegExp('^(?:got|received|income|earned)\\s+(?:rs\\.?|₹)?\\s*'+n+'\\s*(.*)$','i'))){const rest=m[2]||'',g=guessAcct(rest,cfg);return {reply:'Income '+inr2(+m[1])+'.',entries:[{type:'income',amount:+m[1],category:'Income',account:g||lastAcct(),guess:!g,note:rest.trim()}]}}
  return null;
}
/* check a parsed entry before it is saved; returns an error string or '' */
function checkEntry(p){
  const cfg=C(),num=v=>typeof v==='number'?v:parseFloat(v);
  let dt=/^\d{4}-\d{2}-\d{2}$/.test(String(p.date||''))&&!isNaN(parse(p.date).getTime())?p.date:state.date;
  if(diff(dt,todayStr())>1||diff(dt,todayStr())<-400)dt=state.date;
  p.date=dt;
  if(p.type==='expense'||p.type==='income'){
    const a=num(p.amount);if(!(a>0&&a<1e7))return 'That amount is not a valid number';p.amount=a;
    const cats=cfg.categories;if(p.type==='expense'&&!cats.includes(p.category))p.category=guessCat(String(p.note||''),cats);
    if(p.type==='income')p.category='Income';
    if(!cfg.accounts.some(x=>x.id===p.account))p.account='';
    if(!p.account)return 'Choose an account first';
    return '';
  }
  if(p.type==='water'){const v=num(p.ml);if(!(v>=20&&v<=6000))return 'Water should be between 20 and 6000 ml';p.ml=Math.round(v);return ''}
  if(p.type==='weight'){const v=num(p.kg);if(!(v>=30&&v<=250))return 'Weight should be between 30 and 250 kg';p.kg=v;return ''}
  if(p.type==='steps'){const v=num(p.v);if(!(v>=0&&v<=100000))return 'Steps should be between 0 and 100000';p.v=Math.round(v);return ''}
  if(p.type==='burned'){const v=num(p.v);if(!(v>=0&&v<=20000))return 'Calories burned should be between 0 and 20000';p.v=Math.round(v);return ''}
  if(p.type==='cfa'||p.type==='study'){const v=num(p.min);if(!(v>=1&&v<=720))return 'Minutes should be between 1 and 720';p.min=Math.round(v);return ''}
  if(p.type==='protein'){const v=num(p.g);if(!(v>=1&&v<=300))return 'Protein should be between 1 and 300 g';p.g=v;return ''}
  if(p.type==='meal'){const k=num(p.kcal);if(!(k>=0&&k<=5000)||!String(p.name||'').trim())return 'That meal needs a name and a calorie figure';p.kcal=k;return ''}
  return 'I could not tell what that entry is';
}

    else{const cur=accountBal(a).b;addEntry({type:'adjust',account:a.id,amount:+(target-cur).toFixed(2),date:d})}
    closeSheet();toast('Balance saved');}
  else if(k==='todo'){setTodo({id:uid(),title:String(fd.get('title')),q:String(fd.get('q')),pri:QPRI[String(fd.get('q'))]||'med',done:false});f.reset();}
  else if(k==='acad'){setAcad('c-'+uid(),{custom:true,c:String(fd.get('c')),t:String(fd.get('t')),date:String(fd.get('date')||'')||null,k:'Task'});f.reset();}
  else if(k==='habit'){const key=f.dataset.key;const sk=!!fd.get('skip');
    dbSetDay(d,{hnotes:{...(day(d).hnotes||{}),[key]:String(fd.get('note')||'').trim()},skip:{...(day(d).skip||{}),[key]:sk}});
    {const pv=!!fd.get('priv'),pm=privMap();if(!!pm[key]!==pv)saveCfg({hprivate:{...pm,[key]:pv}})}
    const ic=String(fd.get('icon')||'').trim();const cur=C().hicon||{};if((cur[key]||'')!==ic)saveCfg({hicon:{...cur,[key]:ic}});
    closeSheet();toast(sk?'Skipped for today':'Saved');}
  else if(k==='budgets'){const cfg=C(),B={};cfg.categories.forEach((c,i)=>{const v=parseFloat(fd.get('b'+i));if(v>0)B[c]=v});const lim=parseFloat(fd.get('limit'));saveCfg(lim>0?{budgets:B,limit:Math.round(lim)}:{budgets:B});closeSheet();toast('Budgets saved');}
  else if(k==='lrec'){if(lsave(f.dataset.l,f,f.dataset.id)){closeSheet();toast('Saved')}}
  else if(k==='rec'){const amt=parseFloat(fd.get('amount')),dy=parseInt(fd.get('day'),10),nm=String(fd.get('name')||'').trim();if(!(amt>0)||!nm||!(dy>=1&&dy<=28))return;
    const it={id:uid(),name:nm,amount:amt,category:String(fd.get('category')),account:String(fd.get('account')),day:dy,from:recFrom(dy),paused:false,kind:String(fd.get('kind'))==='income'?'income':'expense'};
    saveCfg({recurring:[...(C().recurring||[]),it]});runRecurring();f.reset();toast('Recurring added');}
  else if(k==='tplsave'){const nm=String(fd.get('name')||'').trim();const ms=entriesOn(d,'meal').sort((a,b)=>a.ts-b.ts);if(!nm||!ms.length)return;
    saveCfg({mealTpl:[...(C().mealTpl||[]),{id:uid(),name:nm,items:ms.map(m=>({name:m.name,portion:m.portion||'',kcal:+m.kcal||0,p:+m.p||0,c:+m.c||0,f:+m.f||0}))}]});f.reset();toast('Template saved');}
  else if(k==='chat'){const i=f.querySelector('input');const q=i.value;i.value='';sendChat(q);}
});

/* mobility timer */
function mobStart(){const m=MOB[MOB_BY_DAY[parse(state.date).getDay()]];const mm=state.mob;mm.running=true;mm.idx=0;mm.left=m.s[0][1];clearInterval(mm.timer);mm.timer=setInterval(()=>{mm.left--;if(mm.left<=0)mobNext();else updMob()},1000);render()}
function updMob(){ if(state.view==='today')scheduleRender() }
function mobNext(){const m=MOB[MOB_BY_DAY[parse(state.date).getDay()]];const mm=state.mob;mm.idx++;if(mm.idx>=m.s.length){mobStop();setHabit('mobility',true);toast('Mobility done');render();return}mm.left=m.s[mm.idx][1];render()}
function mobStop(){const mm=state.mob;clearInterval(mm.timer);mm.running=false}

/* export / import */
async function doExport(){
  const payload=exportPayload();
  if(!state.dl){jsonDownload();return}
  try{await state.dl.save({filename:'life-dashboard-'+todayStr()+'.json',data:JSON.stringify(payload,null,2)});state.lastBackup=Date.now();saveLocal();toast('Export ready');closeSheet()}
  catch(e){toast(e&&e.code==='declined'?'Export cancelled':'Export failed')}
}
async function doImport(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=='life-dashboard')throw 0;
    let n=0;
    if(j.cfg){state.cfg={...state.cfg,...j.cfg};wMerge('config','main',JSON.parse(JSON.stringify(j.cfg)),false);n++}
    for(const [k,v] of Object.entries(j.days||{})){state.days[k]=deepMerge(state.days[k]||{},v);wMerge('days',k,JSON.parse(JSON.stringify(v)),true);n++}
    const have=new Set(state.entries.map(e=>e.id));
    for(const e of (j.entries||[])){if(have.has(e.id))continue;state.entries.push(e);wSet('entries',e.id);n++}
    const haveT=new Set(state.todos.map(e=>e.id));
    for(const t of (j.todos||[])){if(haveT.has(t.id))continue;state.todos.push(t);wSet('todos',t.id);n++}
    const haveP=new Set(state.pics.map(e=>e.id));
    for(const e of (j.photos||[])){if(haveP.has(e.id))continue;state.pics.push(e);wSet('photos',e.id);n++}
    for(const [k,v] of Object.entries(j.academics||{})){state.acad[k]=v;wSet('academics',k);n++}
    saveLocal();closeSheet();render();toast('Imported '+n+' records');
  }catch(e){toast('That file is not a dashboard backup')}
}

/* ============ boot ============ */
function mergeList(name,docs,cur,first){
  const D=state.dirty[name]||{};
  if(first&&!docs.length&&cur.length){cur.forEach(x=>mark(name,x.id,'set'));return cur}
  const o=docs.map(x=>({id:x.id,...x.data()}));
  cur.forEach(x=>{if(D[x.id]==='set'){const i=o.findIndex(z=>z.id===x.id);if(i>=0)o[i]=x;else o.push(x)}});
  return o.filter(x=>D[x.id]!=='del');
}
function applySnap(name,snap){
  if(snap.empty&&snap.metadata&&snap.metadata.fromCache)return;
  const first=!state.seen[name],D=state.dirty[name]||{},docs=snap.docs;
  if(name==='days'){
    if(first&&!docs.length&&Object.keys(state.days).length){Object.keys(state.days).forEach(k=>mark('days',k,JSON.parse(JSON.stringify(state.days[k]))))}
    else{const o={};docs.forEach(x=>o[x.id]=x.data());for(const k in D){if(D[k]&&typeof D[k]==='object')o[k]=deepMerge(o[k]||{},D[k])}state.days=o}
  }
  else if(name==='entries')state.entries=mergeList(name,docs,state.entries,first);
  else if(name==='todos')state.todos=mergeList(name,docs,state.todos,first);
  else if(name==='photos')state.pics=mergeList(name,docs,state.pics,first);
  else if(name==='academics'){
    if(first&&!docs.length&&Object.keys(state.acad).length){Object.keys(state.acad).forEach(k=>mark('academics',k,'set'))}
    else{const o={};docs.forEach(x=>o[x.id]=x.data());for(const k in D){if(D[k]==='set'&&state.acad[k])o[k]=state.acad[k];else if(D[k]==='del')delete o[k]}state.acad=o}
  }
  else if(name==='config'){
    const m=docs.find(x=>x.id==='main');
    if(first&&!m&&Object.keys(state.cfg||{}).length){mark('config','main',JSON.parse(JSON.stringify(state.cfg)))}
    else if(m){state.cfg={...m.data(),...((D.main&&typeof D.main==='object')?D.main:{})}}
  }
  else if(name==='meta'){const o={};docs.forEach(x=>o[x.id]=x.data());state.meta=o}
  state.seen[name]=true;
  if(name==='config')loadTheme();
  if(first)flushDirty(name);
  armRec();
  saveLocal();scheduleRender();setSync(state.sync);
}
async function boot(){
  loadLocal();try{state.privacy=!!localStorage.getItem('lifeDash.privacy');state.moneyHide=!!localStorage.getItem('lifeDash.mh')}catch(e){}lookLoad();loadTheme();setSync('loading');render();
  if(!window.claude||!window.claude.use){setSync('local');return}
  try{
    const [db,sample,dl]=await Promise.all([claude.use('db'),claude.use('sample'),claude.use('downloads')]);
    state.sampleFn=sample||null;state.imgOk=null;try{if(sample&&sample.limits)sample.limits().then(l=>{state.imgOk=!!(l&&l.images);state.imgMax=(l&&l.images&&l.images.maxCount)||4;if(state.shot&&document.getElementById('layer')&&document.getElementById('layer').innerText.includes('screenshot'))shotSheet()}).catch(()=>{state.imgOk=null})}catch(e){}state.dl=dl||null;state.db=db||null;
    claude.use('assets').then(a=>{state.assetsApi=a||null;render()}).catch(()=>{});
    if(sample&&sample.limits){sample.limits().then(l=>{state.imgLim=(l&&l.images)||null;render()}).catch(()=>{})}
    if(!db){setSync('local');render();return}
    ['days','entries','todos','academics','config','photos','meta'].forEach(n=>{
      db.collection(n).onSnapshot(s=>applySnap(n,s),e=>{setSync('failed')});
    });
    setSync('saved');render();setTimeout(()=>{if(!state.recDone){state.recDone=true;runRecurring()}},5000);
  }catch(e){setSync('local')}
}

setInterval(checkDay,60000);
